<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SyntaxForge | Course</title>
	</head>

	<body>
		<header>
			<div class="logo-section">
				<a class="gradient-text" id="head" href="/">SyntaxForge</a>
			</div>
			<nav class="nav-section">
				<a href="/courses" class="nav-menu">Courses</a>
				<a href="/editor" class="nav-menu">Playground</a>
			</nav>
			<div class="mobile-menu md:hidden">
				<button id="mobile-menu-btn" class="mobile-menu-button">
					<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
					</svg>
				</button>
			</div>
			<div id="back" class="auth-section">
				<a href="/login" id="login">Login</a>
			</div>
			
			<!-- Mobile Navigation Menu -->
			<div id="mobile-nav" class="mobile-nav hidden">
				<div class="mobile-nav-menu">
					<a href="/courses">Courses</a>
					<a href="/editor">Playground</a>
				</div>
			</div>
		</header>

		<main
			class="flex flex-col items-start justify-start gap-12 px-6 md:px-60"
		>
			<div class="col w-full">
				<h1 class="text-2xl md:text-3xl font-extrabold" id="name"></h1>
				<p class="text-lg md:text-xl" id="desc"></p>
				<div class="col w-full mt-3">
					<h2 id="per" class="text-lg md:text-2xl">0% Done</h2>
					<progress id="pbar" value="0" max="100"></progress>
				</div>
			</div>
			<div
				class="col w-full place-content-start text-lg md:text-2xl"
				id="lessons"
			></div>
		</main>
	</body>
</html>
