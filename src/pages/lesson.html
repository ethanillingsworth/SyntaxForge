<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SyntaxForge | Lesson</title>
	</head>

	<body>
		<header>
			<div class="logo-section">
				<a class="gradient-text" id="head" href="/">SyntaxForge</a>
			</div>
			<nav class="nav-section">
				<a href="/courses" class="nav-menu">Courses</a>
				<a href="/editor" class="nav-menu">Playground</a>
			</nav>
			<div class="mobile-menu md:hidden">
				<button id="mobile-menu-btn" class="mobile-menu-button">
					<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
					</svg>
				</button>
			</div>
			<div id="back" class="auth-section">
				<a href="/login" id="login">Login</a>
			</div>
			
			<!-- Mobile Navigation Menu -->
			<div id="mobile-nav" class="mobile-nav hidden">
				<div class="mobile-nav-menu">
					<a href="/courses">Courses</a>
					<a href="/editor">Playground</a>
				</div>
			</div>
		</header>

		<main
			class="place-content-start place-items-start p-0 col md:row gap-0 md:gap-0 flex w-full h-screen"
		>
			<div
				id="content"
				class="flex flex-col w-full p-4 md:p-8 h-full min-w-1/5 overflow-y-auto"
			>
				<h2 class="text-2xl md:text-3xl mb-6">
					<a id="parent"></a> / <span id="title"></span>
				</h2>

				<div class="flex flex-col w-full gap-6" id="rendered"></div>
				<textarea class="hidden w-full" id="raw"></textarea>

				<h2 class="mt-6">Tasks</h2>
				<div id="tasks" class="flex mt-3 flex-col w-full gap-3"></div>
			</div>

			<div
				id="resizer"
				class="md:min-w-1 md:w-1 min-h-1 h-1 w-full md:h-full cursor-col-resize bg-forge-accent"
			></div>

			<div
				class="col w-full h-full gap-0 md:min-w-2/5 flex-col-reverse md:flex-col"
				id="editor"
			></div>
		</main>
	</body>
</html>
